name: build-tep

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Px-asen/Twilight_Echo
          ref: Pxasen
          path: .twilight-echo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage plugin without the Twilight Echo checkout
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-stage"
          tar \
            --exclude='./.twilight-echo' \
            --exclude='./.git' \
            --exclude='./dist' \
            -cf - . | tar -xf - -C "$RUNNER_TEMP/plugin-stage"

      - name: Pack with the official Twilight Echo CLI
        run: |
          node .twilight-echo/packages/create-twilight-plugin/bin/create-twilight-plugin.cjs pack "$RUNNER_TEMP/plugin-stage" --out dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twilight-echo-wallpaper-engine
          path: dist/*.tep
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tep
          generate_release_notes: true
          overwrite_files: true
